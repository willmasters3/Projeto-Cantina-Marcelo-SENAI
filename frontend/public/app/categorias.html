<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categorias - Cantina</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/pages/categories.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="side-menu">
      <div class="brand">Cantina</div>
      <nav>
        <a href="/app/caixa">Caixa</a>
        <a href="/app/produtos">Produtos</a>
        <a href="/app/categorias">Categorias</a>
        <a href="/app/estoque">Estoque</a>
        <a href="/app/clientes">Clientes</a>
        <a href="/app/fiado">Fiado</a>
        <a href="/app/relatorios">Relatórios</a>
        <a href="/app/configuracoes">Configurações</a>
      </nav>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div>Bem-vindo, <span id="userName"></span></div>
        <button id="logoutButton">Sair</button>
      </header>

      <section class="page-content">
        <h1>Categorias</h1>
        <form id="categoryForm" class="admin-form">
          <label for="categoryName">Nome da categoria</label>
          <input id="categoryName" name="nome" type="text" autocomplete="off" required />
          <button id="categorySubmitButton" type="submit">Cadastrar categoria</button>
        </form>
        <p id="categoryMessage" class="message" aria-live="polite"></p>

        <section class="card">
          <h2>Categorias cadastradas</h2>
          <div id="categoryList" class="table-container" aria-live="polite"></div>
        </section>
      </section>
    </div>
  </div>
  <script type="module" src="../js/appLayout.js"></script>
  <script type="module" src="../js/categoriesApp.js"></script>
</body>
</html>
