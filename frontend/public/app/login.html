<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Cantina</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/pages/login.css" />
</head>
<body>
  <main class="container auth-container">
    <p class="eyebrow">Projeto Cantina</p>
    <h1>Acesso ao sistema</h1>
    <p>Entre com suas credenciais para acessar a área interna.</p>
    <form id="loginForm" class="auth-form">
      <label for="loginEmail">Login</label>
      <input id="loginEmail" name="email" type="text" autocomplete="username" required autofocus />
      <label for="loginPassword">Senha</label>
      <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Entrar</button>
    </form>
    <p id="loginMessage" class="message" aria-live="polite"></p>
    <a class="public-link" href="/monitor">Ir para o autoatendimento</a>
    <footer class="app-credit-footer auth-credit-footer">
      Sistema Cantina <span aria-hidden="true">•</span>
      <a href="/app/configuracoes?tab=sobre-licenca">Desenvolvido por William Pereira do Nascimento</a>
    </footer>
  </main>
  <script type="module" src="../js/loginApp.js"></script>
</body>
</html>
